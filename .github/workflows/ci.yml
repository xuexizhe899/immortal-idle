name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend / pytest + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        working-directory: backend
        run: python -m pytest -q
      - name: Migrate up and down
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Export OpenAPI contract
        working-directory: backend
        run: python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json
          retention-days: 1

  config:
    name: config / reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate config
        run: python tools/validate_config.py
      - name: Check RNG usage
        run: python tools/check_rng_usage.py
      - name: Test validator
        run: python -m pytest tools/tests -q

  frontend:
    name: frontend / tests + types + build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
