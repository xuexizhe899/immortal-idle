services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: immortal-idle-app:${TAG:-latest}
    restart: unless-stopped
    environment:
      # 四个斜杠表示容器内绝对路径；数据卷挂在 /data，重建容器不丢档。
      XIUXIAN_DB_URL: sqlite+aiosqlite:////data/xiuxian.db
    volumes:
      - app_data:/data
      # 配置以宿主目录为准，改词条/敌人不用重建镜像。
      - ../config:/config:ro
    ports:
      # 绑 docker0 网关：宿主上的 nginx 容器可访问，公网不可达。
      - "172.17.0.1:18000:8000"
    expose:
      - "8000"

  # 容器内只跑 HTTP；TLS 由宿主已有的 nginx 终止，避免重复占用 80/443。
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: immortal-idle-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "172.17.0.1:18080:80"
    depends_on:
      - app

volumes:
  app_data:
