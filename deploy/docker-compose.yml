services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: immortal-idle-app:${TAG:-latest}
    restart: unless-stopped
    environment:
      # 四个斜杠表示容器内绝对路径；数据卷挂在 /data，重建容器不丢档。
      XIUXIAN_DB_URL: sqlite+aiosqlite:////data/xiuxian.db
    volumes:
      - app_data:/data
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: immortal-idle-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?在 deploy/.env 里填写 SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
